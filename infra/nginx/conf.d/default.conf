# DealFlow360 Nginx Reverse Proxy: Internal Sales Workspace (SPA) + API routing.

upstream api_upstream {
    server api:3000;
}

upstream workspace_upstream {
    server workspace:5173;
}

server {
    listen 80;
    server_name _;

    # API
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Workspace SPA (Vite dev server, incl. HMR websocket)
    location / {
        proxy_pass http://workspace_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

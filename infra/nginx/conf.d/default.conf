# DealFlow360 Nginx Reverse Proxy: Internal Sales Workspace (SPA) + Customer Portal (SPA) + API routing.

upstream api_upstream {
    server api:3000;
}

upstream workspace_upstream {
    server workspace:5173;
}

upstream portal_upstream {
    server portal:5174;
}

server {
    listen 80;
    server_name _;

    # Allow logo/report uploads up to 10 MB (API itself enforces 5 MB per file;
    # nginx's 1 MB default would reject larger uploads with an opaque 413).
    client_max_body_size 10m;

    # API
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (realtime pricing / approvals / negotiation events) -> API
    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Customer Portal SPA (Vite dev server, incl. HMR websocket)
    location /portal/ {
        proxy_pass http://portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /portal {
        return 301 /portal/;
    }

    # Workspace SPA (Vite dev server, incl. HMR websocket)
    location / {
        proxy_pass http://workspace_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
